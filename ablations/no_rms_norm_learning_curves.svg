<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" role="img" aria-labelledby="title desc">
  <title id="title">No-RMSNorm validation learning curves</title>
  <desc id="desc">Validation loss over 1000 steps for learning rates 0.001 and 0.0003.</desc>
  <rect width="920" height="580" fill="#ffffff"/>
  <text x="80" y="30" font-family="Arial, sans-serif" font-size="22" fill="#1f2937">No-RMSNorm Validation Loss</text>
  <text x="80" y="52" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">1,000-step study; lower is better</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="60" x2="870" y2="60"/>
    <line x1="80" y1="118.6" x2="870" y2="118.6"/>
    <line x1="80" y1="177.1" x2="870" y2="177.1"/>
    <line x1="80" y1="235.7" x2="870" y2="235.7"/>
    <line x1="80" y1="294.3" x2="870" y2="294.3"/>
    <line x1="80" y1="352.9" x2="870" y2="352.9"/>
    <line x1="80" y1="411.4" x2="870" y2="411.4"/>
    <line x1="80" y1="470" x2="870" y2="470"/>
    <line x1="80" y1="60" x2="80" y2="470"/>
    <line x1="238" y1="60" x2="238" y2="470"/>
    <line x1="396" y1="60" x2="396" y2="470"/>
    <line x1="554" y1="60" x2="554" y2="470"/>
    <line x1="712" y1="60" x2="712" y2="470"/>
    <line x1="870" y1="60" x2="870" y2="470"/>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="80" y1="470" x2="870" y2="470"/>
    <line x1="80" y1="60" x2="80" y2="470"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
    <text x="64" y="474" text-anchor="end">0</text>
    <text x="64" y="416" text-anchor="end">2</text>
    <text x="64" y="357" text-anchor="end">4</text>
    <text x="64" y="299" text-anchor="end">6</text>
    <text x="64" y="240" text-anchor="end">8</text>
    <text x="64" y="182" text-anchor="end">10</text>
    <text x="64" y="123" text-anchor="end">12</text>
    <text x="64" y="64" text-anchor="end">14</text>
    <text x="80" y="490" text-anchor="middle">0</text>
    <text x="238" y="490" text-anchor="middle">200</text>
    <text x="396" y="490" text-anchor="middle">400</text>
    <text x="554" y="490" text-anchor="middle">600</text>
    <text x="712" y="490" text-anchor="middle">800</text>
    <text x="870" y="490" text-anchor="middle">1000</text>
    <text x="475" y="525" text-anchor="middle">Training step</text>
    <text x="20" y="265" text-anchor="middle" transform="rotate(-90 20 265)">Validation loss</text>
  </g>
  <polyline fill="none" stroke="#b42318" stroke-width="3"
    points="80,80.9 159,377.5 238,395.8 317,401.9 396,406.6 475,410.7 554,411.7 633,413.1 712,413.3 791,411.3"/>
  <polyline fill="none" stroke="#176b87" stroke-width="3"
    points="80,80.9 159,361.6 238,385.7 317,393.2 396,398.2 475,403.1 554,404.1 633,406.8 712,407.7 791,410.2"/>
  <g fill="#b42318">
    <circle cx="80" cy="80.9" r="4"/><circle cx="159" cy="377.5" r="4"/>
    <circle cx="238" cy="395.8" r="4"/><circle cx="317" cy="401.9" r="4"/>
    <circle cx="396" cy="406.6" r="4"/><circle cx="475" cy="410.7" r="4"/>
    <circle cx="554" cy="411.7" r="4"/><circle cx="633" cy="413.1" r="4"/>
    <circle cx="712" cy="413.3" r="4"/><circle cx="791" cy="411.3" r="4"/>
  </g>
  <g fill="#176b87">
    <circle cx="80" cy="80.9" r="4"/><circle cx="159" cy="361.6" r="4"/>
    <circle cx="238" cy="385.7" r="4"/><circle cx="317" cy="393.2" r="4"/>
    <circle cx="396" cy="398.2" r="4"/><circle cx="475" cy="403.1" r="4"/>
    <circle cx="554" cy="404.1" r="4"/><circle cx="633" cy="406.8" r="4"/>
    <circle cx="712" cy="407.7" r="4"/><circle cx="791" cy="410.2" r="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13">
    <line x1="635" y1="86" x2="665" y2="86" stroke="#b42318" stroke-width="3"/>
    <text x="675" y="90" fill="#1f2937">learning rate 1e-3</text>
    <line x1="635" y1="111" x2="665" y2="111" stroke="#176b87" stroke-width="3"/>
    <text x="675" y="115" fill="#1f2937">learning rate 3e-4</text>
  </g>
  <text x="80" y="557" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Validation checkpoints were recorded every 100 steps.</text>
</svg>
