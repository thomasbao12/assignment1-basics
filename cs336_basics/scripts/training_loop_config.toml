[data]
train_file = "data/tiny_stories_train_smoke_test.tokens.npy"
validation_file = "data/tiny_stories_valid_smoke_test.tokens.npy"

[model]
vocab_size = 1001
context_length = 128
d_model = 128
num_layers = 2
num_heads = 4
d_ff = 384
rope_theta = 10000.0

[optimizer]
learning_rate = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
weight_decay = 0.01
max_grad_norm = 1.0

[training]
batch_size = 4
max_iters = 1000
log_every = 100
device = "cpu"

[lr_schedule]
warmup_iters = 100
cosine_cycle_iters = 1000
min_learning_rate = 0.0001